<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Grafo de tipos Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: barra de controles arriba; grafo grande a la izquierda y ficha del tipo a la derecha (se apila en móvil) */
:root{
  --bg:#F1F2F7; --surface:#FFFFFF; --fg:#191C26; --muted:#5A6074; --line:#D8DBE6;
  --accent:#3543B5; --on-accent:#FFFFFF; --sup:#1E8C4C; --res:#C93838; --warn:#B7791F; --on-mark:#FFFFFF;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#1A1D27; --fg:#E7E9F1; --muted:#9BA1B4; --line:#2C3142;
  --accent:#7C89FF; --on-accent:#0E1020; --sup:#4ACB83; --res:#FF6E6E; --warn:#F0B44C; --on-mark:#0E1020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#1A1D27; --fg:#E7E9F1; --muted:#9BA1B4; --line:#2C3142;
  --accent:#7C89FF; --on-accent:#0E1020; --sup:#4ACB83; --res:#FF6E6E; --warn:#F0B44C; --on-mark:#0E1020; color-scheme:dark}

html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1260px;margin:0 auto;padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.3rem);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:.3rem 0 0;max-width:68ch}
.sub b{color:var(--fg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px}
.seg.lang{flex:none}
.seg.lang button{padding:8px 11px}

.bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:20px 0 14px}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:600 .88rem/1 var(--display);letter-spacing:.02em;border:0;background:transparent;color:var(--muted);
  padding:9px 13px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--fg)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.toggles button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.seg.toggles button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
[hidden]{display:none!important}
button:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.n:focus{outline:none}
.n:focus-visible .halo{stroke:var(--accent)}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font:600 .7rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sw{width:22px;height:0;border-top:2.5px solid;display:inline-block}
.sw.s2{border-color:var(--sup)} .sw.s05{border-color:var(--res);border-top-style:dashed}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.stage.wide .panel{display:none}
@media (max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}
.graph{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.graph svg{display:block;width:100%;height:auto;touch-action:manipulation}
.stage.wide .graph{max-width:960px;margin:0 auto;width:100%}
.hint{font-size:.82rem;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line)}

/* aristas */
.e{fill:none;stroke-width:1.5;opacity:.42;transition:opacity .18s,stroke-width .18s}
.e.s2{stroke:var(--sup)} .e.s05{stroke:var(--res);stroke-dasharray:5 4}
.e.off{display:none}
svg.focused .e{opacity:.04}
svg.focused .e.on{opacity:1;stroke-width:2.4}
svg.static .e{opacity:.55}
/* nodos */
.n{cursor:pointer;transition:opacity .18s}
svg.static .n{cursor:default}
.n .disc{stroke:var(--surface);stroke-width:3}
.n .halo{fill:none;stroke:transparent;stroke-width:2.5}
.n.sel .halo{stroke:var(--fg)}
.n.dim{opacity:.22}
.lab{font:600 13px var(--display);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;pointer-events:none;letter-spacing:.02em}

/* ficha */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ph h2{font:700 1.45rem var(--display);margin:0;letter-spacing:.01em}
.ph .mode{font-size:.82rem;color:var(--muted)}
.sec{margin-top:16px}
.sec h3{font:600 .72rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:8px;align-items:start;margin:8px 0}
.mult{font:700 .85rem var(--display);padding:3px 0;border-radius:6px;text-align:center;font-variant-numeric:tabular-nums}
.mult.s2{color:var(--sup);box-shadow:inset 0 0 0 1.5px var(--sup)}
.mult.s05{color:var(--res);box-shadow:inset 0 0 0 1.5px var(--res)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 .84rem var(--body);background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 3px;cursor:pointer}
.chip:hover{border-color:var(--fg)}
.none{color:var(--muted);font-size:.85rem;padding:3px 0}
.ico{display:inline-block;flex:none}
.empty p{margin:.4rem 0;color:var(--muted)}
.empty .big{font:700 1.15rem var(--display);color:var(--fg);margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font:700 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat.s2 .v{color:var(--sup)} .stat.s05 .v{color:var(--res)}
.note{font-size:.8rem;color:var(--muted);margin-top:14px}
.mn{margin:2px 0 10px 4.2rem;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:.86rem;line-height:1.55}
.mn::before{content:"Para recordarlo";display:block;font:600 .64rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
@media (max-width:420px){.mn{margin-left:0}}
html[lang="en"] .mn::before{content:"To remember"}
html[lang="en"] .mn2::before{content:"To remember · "}
.tk{display:inline-flex;align-items:center;gap:3px;font-weight:700;white-space:nowrap;vertical-align:-3px}
.grp-bg{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.grp-lab{font:600 12px var(--display);fill:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.chk{font-size:.88rem;cursor:pointer;gap:7px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
/* práctica */
.pr{display:grid;grid-template-columns:240px minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1180px){.pr{grid-template-columns:minmax(0,1fr) 380px}.prset{grid-column:1/-1}}
@media (max-width:880px){.pr{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.prset summary{font:700 1.05rem var(--display);cursor:pointer}
.fs{display:grid;gap:16px;margin-top:14px}
@media (max-width:1180px){.fs{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.f{display:flex;flex-direction:column;gap:6px}
.f label:not(.lbl){display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer;line-height:1.35}
.f input{accent-color:var(--accent);margin-top:2px}
select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.quiz{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
.qhead b{color:var(--fg)}
.streak{font:600 .85rem var(--display);color:var(--muted)}
.qtitle{font:700 1.35rem var(--display);text-align:center;margin:0;text-wrap:balance}
.matchup{display:flex;justify-content:center;align-items:center;gap:14px 18px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;align-items:center;gap:6px}
.side>div{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.vs{font:600 .95rem var(--display);color:var(--muted);padding-top:20px}
.tpill{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:10px;background:var(--c);color:var(--tc);font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.06em;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.opts{display:grid;gap:8px}
.opt{font:700 1.05rem var(--display);padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font:600 .7rem var(--body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt.right{background:var(--sup);border-color:var(--sup);color:var(--on-mark)}
.opt.wrong{background:var(--res);border-color:var(--res);color:var(--on-mark)}
.opt.right .k,.opt.wrong .k{color:inherit;border-color:currentColor}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.4}
.fb{border-radius:10px;background:var(--bg);padding:12px 14px;font-size:.92rem;line-height:1.55}
.fbh{font:700 1.1rem var(--display);margin-bottom:4px}
.fbh.ok{color:var(--sup)} .fbh.ko{color:var(--res)}
.calc{display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums;margin:4px 0 8px;color:var(--muted)}
.calc b{color:var(--fg)}
.mn2{margin:6px 0}
.mn2::before{content:"Para recordarlo · ";font:600 .66rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.neu{margin:6px 0 0;color:var(--muted)}
.qfoot{display:flex;align-items:center;gap:12px;min-height:38px}
.timer{height:4px;background:var(--line);border-radius:4px;overflow:hidden;flex:1}
.timer i{display:block;height:100%;width:0;background:var(--accent)}
.primary{font:600 .9rem var(--display);background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
.keys{font-size:.78rem;color:var(--muted);margin:0;text-align:center}
@media (hover:none){.keys:not(.sorthint),.opt .k,.zh .k{display:none}}
.sh{font:700 1.2rem var(--display);margin:0 0 10px}
.muted{color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3>div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column}
.stats3 b{font:700 1.45rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats3 span{font-size:.78rem;color:var(--muted)}
.summ h3{font:600 .72rem var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 8px}
.bw .tip{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);margin-top:16px}
.thead h3{margin:0 0 6px}
.link{background:none;border:0;color:var(--accent);font:600 .82rem var(--body);cursor:pointer;padding:4px 0}
.trow{display:grid;grid-template-columns:7.6rem minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.trow.th{font:600 .66rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:8px}
.tn{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b2{position:relative;height:20px;border-radius:5px;background:var(--bg);overflow:hidden}
.b2 i{position:absolute;inset:0 auto 0 0;opacity:.32;border-radius:5px;border-right:3px solid}
.b2 span{position:relative;font:600 .74rem/20px var(--display);padding-left:7px;font-variant-numeric:tabular-nums;color:var(--fg)}
.b2 small{font-weight:500;color:var(--muted)}
.b2.none span{color:var(--muted)}
.fails{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fails li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:.88rem;padding:6px 0;border-bottom:1px solid var(--line)}
.fails .mu{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.fails .cnt{grid-column:1/-1;color:var(--muted);font-size:.76rem;font-style:normal}
.fails .rec{grid-column:1/-1;font-size:.84rem;line-height:1.5;background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:4px}
.fails .rec>b{font:600 .7rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.reset{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;font-size:.88rem}
.danger{background:var(--res);color:var(--on-mark);border:0;border-radius:7px;padding:6px 12px;font:600 .82rem var(--body);cursor:pointer}
.store{font-size:.76rem;color:var(--muted);margin:10px 0 0}
.hintf{font-size:.78rem;color:var(--muted);margin:2px 0 0}
.xfer{margin-top:16px;border-top:1px solid var(--line)}
.xbtns{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:8px}
.xfer textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 .76rem/1.4 ui-monospace,Consolas,monospace;resize:vertical;word-break:break-all}
.xmsg{font-size:.84rem;margin:8px 0 0}
.xmsg.ok{color:var(--sup)} .xmsg.ko{color:var(--res)}
.board{display:flex;flex-direction:column;gap:8px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{border:1.5px dashed var(--line);border-radius:10px;padding:8px;min-height:64px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,background .15s}
.zone.armed{cursor:pointer;border-color:var(--accent)}
.zone.over{border-style:solid;border-color:var(--accent);background:var(--bg)}
.zh{display:flex;align-items:baseline;gap:6px;font:700 .9rem var(--display)}
.zh span{font-weight:600;color:var(--muted);font-size:.8rem}
.zh .k{margin-left:auto;font:600 .66rem var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.zone[data-m="2"] .zh b{color:var(--sup)} .zone[data-m="0.5"] .zh b{color:var(--res)}
.zc{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-height:30px}
.zone.imm .zc{min-height:30px}
.sc{display:inline-flex;align-items:center;gap:4px;font:600 .78rem var(--body);background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:99px;padding:2px 8px 2px 2px;cursor:grab;max-width:100%;touch-action:manipulation}
.sc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sc.good{border-color:var(--sup);cursor:default}
.sc.bad{border-color:var(--res);background:var(--surface);cursor:default}
.sc .fix{color:var(--res);font-weight:700}
@media (max-width:480px){.sc{font-size:.72rem}.cols{gap:5px}.zone{padding:6px}}
@media (prefers-reduced-motion:reduce){.e,.n{transition:none}.timer i{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i18n="title">Grafo de tipos Pokémon</h1>
      <p class="sub" data-i18n-html="sub"></p>
    </div>
    <div class="seg lang" role="group" aria-label="Idioma / Language">
      <button data-lang="es" aria-pressed="true" lang="es" title="Español">ES</button>
      <button data-lang="en" aria-pressed="false" lang="en" title="English">EN</button>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="tablist" data-i18n-aria="viewAria">
      <button role="tab" id="tab-circular" data-view="circular" aria-selected="true" data-i18n="tabCircular"></button>
      <button role="tab" id="tab-fuerzas" data-view="fuerzas" aria-selected="false" data-i18n="tabForce"></button>
      <button role="tab" id="tab-estatico" data-view="estatico" aria-selected="false" data-i18n="tabStatic" hidden></button>
      <button role="tab" id="tab-grupos" data-view="grupos" aria-selected="false" data-i18n="tabGroups"></button>
      <button role="tab" id="tab-practica" data-view="practica" aria-selected="false" data-i18n="tabPractice"></button>
    </div>
    <div class="grp" id="showGrp">
      <span class="lbl" data-i18n="show"></span>
      <div class="seg toggles">
        <button id="t2" aria-pressed="true"><span class="sw s2"></span>x2</button>
        <button id="t05" aria-pressed="true"><span class="sw s05"></span>x0.5</button>
      </div>
    </div>
    <div class="grp" id="modeGrp">
      <span class="lbl" data-i18n="modeLbl"></span>
      <div class="seg" id="modes">
        <button data-mode="atk" aria-pressed="true" data-i18n="whenAtk"></button>
        <button data-mode="def" aria-pressed="false" data-i18n="whenDef"></button>
        <button data-mode="both" aria-pressed="false" data-i18n="both"></button>
      </div>
    </div>
    <label class="grp chk" id="dragGrp" hidden><input type="checkbox" id="dragChk"> <span data-i18n="allowDrag"></span></label>
  </div>

  <div class="stage" id="stage">
    <div class="graph">
      <svg id="svg-circular" role="img" data-i18n-aria="ariaCircular"></svg>
      <svg id="svg-fuerzas" role="img" data-i18n-aria="ariaForce" hidden></svg>
      <svg id="svg-estatico" role="img" data-i18n-aria="ariaStatic" hidden></svg>
      <svg id="svg-grupos" role="img" data-i18n-aria="ariaGroups" hidden></svg>
      <div class="hint" id="hint"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="pr" id="practice" hidden>
    <details class="card prset" id="prset" open>
      <summary data-i18n="settings"></summary>
      <div class="fs">
        <div class="f"><span class="lbl" data-i18n="sDefType"></span>
          <label><input type="radio" name="pdef" value="mono"> <span data-i18n="sMono"></span></label>
          <label><input type="radio" name="pdef" value="dual"> <span data-i18n="sDual"></span></label>
          <label><input type="radio" name="pdef" value="both"> <span data-i18n="both"></span></label></div>
        <div class="f"><label class="lbl" for="pfocus" data-i18n="sFocus"></label><select id="pfocus"></select></div>
        <div class="f"><span class="lbl" data-i18n="sPause"></span>
          <label><input type="radio" name="ppause" value="d5"> <span data-i18n="sP5"></span></label>
          <label><input type="radio" name="ppause" value="d5err"> <span data-i18n="sP5err"></span></label>
          <label><input type="radio" name="ppause" value="none"> <span data-i18n="sPnone"></span></label>
          <label><input type="radio" name="ppause" value="manual"> <span data-i18n="sPmanual"></span></label></div>
        <div class="f"><span class="lbl" data-i18n="sAnswers"></span>
          <label><input type="radio" name="pfmt" value="num"> <span data-i18n="sNum"></span></label>
          <label><input type="radio" name="pfmt" value="verb"> <span data-i18n="sVerb"></span></label>
          <label><input type="checkbox" id="pextra"> <span data-i18n="sExtra"></span></label>
          <label><input type="checkbox" id="pimm"> <span data-i18n="sImm"></span></label>
          <label><input type="checkbox" id="psmart"> <span data-i18n="sSmart"></span></label></div>
        <div class="f"><span class="lbl" data-i18n="sMnem"></span>
          <label><input type="radio" name="pmnem" value="def"> <span data-i18n="sMnDef"></span></label>
          <label><input type="radio" name="pmnem" value="atk"> <span data-i18n="sMnAtk"></span></label>

/* Iconos propios: círculo del color del tipo con un glifo sencillo en blanco (caja 24x24) */
function star(n,ro,ri,cx=12,cy=12,rot=-Math.PI/2){
  const p=[]; for(let k=0;k<2*n;k++){const r=k%2?ri:ro,a=rot+k*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2));}
  return p.join(' ');
}
function glyph(id,c){
  const W='#fff';
  switch(id){
    case 'normal': return `<circle cx="12" cy="12" r="6.2" fill="none" stroke="${W}" stroke-width="3.2"/>`;
    case 'fire': return `<path fill="${W}" d="M12 2c1 4 6.5 6 6.5 12a6.5 6.5 0 0 1-13 0c0-3 1.8-5.2 3.2-6.3 0 2 .9 3.3 2.1 3.6C10.6 8.200 10.300 5 12 2z"/>`;
    case 'water': return `<path fill="${W}" d="M12 2.5c3.6 5 6.2 8.3 6.2 11.7a6.2 6.2 0 0 1-12.4 0c0-3.4 2.6-6.7 6.2-11.7z"/>`;
    case 'electric': return `<path fill="${W}" d="M13.8 2 5 13.6h5.6L9.4 22 19 9.8h-5.7z"/>`;
    case 'grass': return `<path fill="${W}" d="M4.5 19.5C4.5 10.5 10.5 4.8 20 4c-.8 9.500-6.500 15.500-15.500 15.500z"/><path d="M5.500 18.500 13.500 10.500" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`;
    case 'ice': return `<g stroke="${W}" stroke-width="2.4" stroke-linecap="round">${[0,60,120].map(a=>`<line x1="12" y1="3" x2="12" y2="21" transform="rotate(${a} 12 12)"/>`).join('')}</g><circle cx="12" cy="12" r="2.6" fill="${W}"/>`;
    case 'fighting': return `<polygon fill="${W}" points="${star(8,10,4.6)}"/>`;
    case 'poison': return `<circle cx="9.5" cy="14.5" r="5.300" fill="${W}"/><circle cx="16.5" cy="7.500" r="3.400" fill="${W}"/><circle cx="18" cy="16.5" r="2" fill="${W}"/>`;
    case 'ground': return `<g fill="${W}"><rect x="3" y="5.500" width="18" height="3.400" rx="1.700"/><rect x="5.500" y="10.500" width="13" height="3.400" rx="1.700"/><rect x="8" y="15.500" width="8" height="3.400" rx="1.700"/></g>`;
    case 'flying': return `<path fill="${W}" d="M20 3.500C12 4 6.500 9 5.500 16.800L4.200 21l2.300-1.200c.9-2.800 2.400-5 4.300-6.800h3.700l-2-1.800 3.900-1.300-1.800-1.700c2.300-1.100 4.300-3 5.400-4.700z"/>`;
    case 'psychic': return `<path fill="${W}" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.400" fill="${c}"/><circle cx="12" cy="12" r="1.400" fill="${W}"/>`;
    case 'bug': return `<g stroke="${W}" stroke-width="1.800" stroke-linecap="round"><line x1="10" y1="8" x2="7" y2="3"/><line x1="14" y1="8" x2="17" y2="3"/></g><ellipse cx="12" cy="14.500" rx="5.600" ry="6.800" fill="${W}"/><line x1="12" y1="9" x2="12" y2="20.500" stroke="${c}" stroke-width="1.600"/>`;
    case 'rock': return `<polygon fill="${W}" points="3.500,15.500 7,6 14,3 20.500,9 19.500,18.500 11,21"/><polyline points="7,6 11,12 20.500,9" fill="none" stroke="${c}" stroke-width="1.400" stroke-linejoin="round"/>`;
    case 'ghost': return `<path fill="${W}" d="M5.500 21V11a6.500 6.500 0 0 1 13 0v10l-2.200-2-2.100 2-2.200-2-2.200 2-2.100-2z"/><circle cx="9.600" cy="11" r="1.600" fill="${c}"/><circle cx="14.400" cy="11" r="1.600" fill="${c}"/>`;
    case 'dragon': return `<g fill="${W}"><polygon points="4,20.500 9,3.500 10.800,4.200 6.600,20.500"/><polygon points="9.600,21 14.600,3 16.400,3.700 12.200,21"/><polygon points="15.200,20.500 20.200,3.500 21.800,4.200 17.800,20.500"/></g>`;
    case 'dark': return `<path fill="${W}" d="M15.500 2.800a9.300 9.300 0 1 0 5.900 14.800A8 8 0 0 1 15.500 2.800z"/>`;
    case 'steel': return `<polygon fill="${W}" points="${star(3,9.600,9.600,12,12,0).split(' ').filter((_,k)=>true).join(' ')}"/><circle cx="12" cy="12" r="3.600" fill="${c}"/>`;
    case 'fairy': return `<polygon fill="${W}" points="${star(4,10,2.800,11,13)}"/><polygon fill="${W}" points="${star(4,4,1.200,19,5)}"/>`;
  }
  return '';
}
function iconSVG(t,size){
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="${t.c}"/><g transform="translate(4.500 4.500) scale(.96)">${glyph(t.id,t.c)}</g></svg>`;
}

/* estado compartido */
const S = {drag:false, view:'circular', hover:null, sel:null, mode:'atk', show2:true, show05:true};
const focusId = () => S.view==='estatico' ? null : (S.hover || S.sel);
const visible = e => e.m===2 ? S.show2 : S.show05;
function activeEdge(e,f){
  if(!f || !visible(e)) return false;
  if(S.mode==='atk') return e.s===f;
  if(S.mode==='def') return e.t===f;
  return e.s===f || e.t===f;
}
const views = [];
function refresh(){ views.forEach(v=>v.apply()); renderPanel(); }

/* geometría */
const NR = 22;
function arcPath(p1,p2,r,curv){
  const dx=p2.x-p1.x, dy=p2.y-p1.y, d=Math.hypot(dx,dy)||1;
  const cx=(p1.x+p2.x)/2 - dy/d*d*curv, cy=(p1.y+p2.y)/2 + dx/d*d*curv;
  const u1=unit(cx-p1.x,cy-p1.y), u2=unit(cx-p2.x,cy-p2.y);
  const sx=p1.x+u1.x*(r+1), sy=p1.y+u1.y*(r+1), ex=p2.x+u2.x*(r+2), ey=p2.y+u2.y*(r+2);
  return `M${sx.toFixed(1)},${sy.toFixed(1)}Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
}
function unit(x,y){const l=Math.hypot(x,y)||1;return {x:x/l,y:y/l};}
function rot(u,a){return {x:u.x*Math.cos(a)-u.y*Math.sin(a), y:u.x*Math.sin(a)+u.y*Math.cos(a)};}
function loopPath(p,u,r){
  const a=rot(u,-.55), b=rot(u,.55), ca=rot(u,-.75), cb=rot(u,.75), L=r+44;
  return `M${(p.x+a.x*(r+1)).toFixed(1)},${(p.y+a.y*(r+1)).toFixed(1)}C${(p.x+ca.x*L).toFixed(1)},${(p.y+ca.y*L).toFixed(1)} ${(p.x+cb.x*L).toFixed(1)},${(p.y+cb.y*L).toFixed(1)} ${(p.x+b.x*(r+2)).toFixed(1)},${(p.y+b.y*(r+2)).toFixed(1)}`;
}
function addDefs(svg,pre){
  const d=svg.append('defs');
  [['a2','var(--sup)'],['a05','var(--res)']].forEach(([k,col])=>{
    d.append('marker').attr('id',`${pre}-${k}`).attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
      .attr('markerWidth',9).attr('markerHeight',9).attr('markerUnits','userSpaceOnUse').attr('orient','auto')
      .append('path').attr('d','M0,0L10,5L0,10z').style('fill',col);
  });
}
function drawNodes(g,data){
  const n=g.selectAll('g.n').data(data,d=>d.id).join('g').attr('class','n');
  n.append('circle').attr('class','halo').attr('r',NR+5);
  n.append('circle').attr('class','disc').attr('r',NR).attr('fill',d=>d.c);
  n.append('g').attr('transform',`translate(${-NR*0.66},${-NR*0.66}) scale(${NR*1.32/24})`).html(d=>glyph(d.id,d.c));
  n.append('title').text(d=>d.n);
  return n;
}
function bindNode(n,svgEl){
  n.attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.n)
    .on('mouseenter',(ev,d)=>{S.hover=d.id;refresh();})
    .on('mouseleave',()=>{S.hover=null;refresh();})
    .on('click',(ev,d)=>{ev.stopPropagation();S.sel = S.sel===d.id?null:d.id;S.hover=null;refresh();})
    .on('keydown',(ev,d)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();S.sel=S.sel===d.id?null:d.id;refresh();}});
  d3.select(svgEl).on('click',()=>{S.sel=null;refresh();});
}
function applyCommon(svg,paths,nodes,interactive){
  const f = interactive ? focusId() : null;
  svg.classed('focused',!!f);
  paths.classed('off',e=>!visible(e)).classed('on',e=>activeEdge(e,f));
  const rel=new Set(); if(f){rel.add(f);EDGES.forEach(e=>{if(activeEdge(e,f)){rel.add(e.s);rel.add(e.t);}});}
  nodes.classed('dim',d=>f && !rel.has(d.id)).classed('sel',d=>interactive && S.sel===d.id);
}

/* vista circular (interactiva o estática) */
function buildCircle(id,interactive){
  const el=document.getElementById(id), svg=d3.select(el);
  const C=400,R=272;
  svg.attr('viewBox','-75 25 950 750'); if(!interactive) svg.classed('static',true);
  addDefs(svg,id);
  const pos={}; TYPES.forEach(t=>{const a=-Math.PI/2+t.i*2*Math.PI/TYPES.length;pos[t.id]={x:C+R*Math.cos(a),y:C+R*Math.sin(a),a};});
  const paths=svg.append('g').selectAll('path').data(EDGES).join('path')
    .attr('class',e=>'e '+(e.m===2?'s2':'s05'))
    .attr('marker-end',e=>`url(#${id}-${e.m===2?'a2':'a05'})`)

/* vista de fuerzas */
function buildForce(id){
  const el=document.getElementById(id), svg=d3.select(el);
  const W=900,H=760; svg.attr('viewBox',`0 0 ${W} ${H}`);
  addDefs(svg,id);
  const nodesData=TYPES.map(t=>{const a=-Math.PI/2+t.i*2*Math.PI/18;return Object.assign(Object.create(t),{x:W/2+250*Math.cos(a),y:H/2+250*Math.sin(a)});});
  const ND=Object.fromEntries(nodesData.map(d=>[d.id,d]));
  const links=EDGES.filter(e=>e.s!==e.t).map(e=>({source:e.s,target:e.t,m:e.m}));
  const paths=svg.append('g').selectAll('path').data(EDGES).join('path')
    .attr('class',e=>'e '+(e.m===2?'s2':'s05'))
    .attr('marker-end',e=>`url(#${id}-${e.m===2?'a2':'a05'})`);
  const gN=svg.append('g');
  const nodes=drawNodes(gN,nodesData);
  nodes.append('text').attr('class','lab').attr('y',NR+16).attr('text-anchor','middle').text(d=>d.n);
  bindNode(nodes,el);
  const M=NR+30;
  const sim=d3.forceSimulation(nodesData)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(170).strength(.04))
    .force('charge',d3.forceManyBody().strength(-900))
    .force('x',d3.forceX(W/2).strength(.06)).force('y',d3.forceY(H/2).strength(.07))
    .force('collide',d3.forceCollide(NR+26));
  const draw=()=>{
      nodesData.forEach(d=>{d.x=Math.max(M,Math.min(W-M,d.x));d.y=Math.max(M,Math.min(H-M-10,d.y));});
      nodes.attr('transform',d=>`translate(${d.x},${d.y})`);
      paths.attr('d',e=>{
        const a=ND[e.s], b=ND[e.t];
        if(a===b) return loopPath(a,unit(a.x-W/2,a.y-H/2),NR);
        return arcPath(a,b,NR,.12);
      });
    };
  sim.stop(); for(let i=0;i<500;i++) sim.tick(); draw(); sim.on('tick',draw);
  nodes.call(d3.drag().filter(ev=>S.drag && !ev.button)
    .on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
    .on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  views.push({apply:()=>applyCommon(svg,paths,nodes,true)});
}

/* vista por grupos: posiciones optimizadas para minimizar cruces (≈120 frente a ≈600 del círculo) */
const GPOS={"normal":[454,511],"fire":[417,260],"water":[202,317],"electric":[92,458],"grass":[172,174],"ice":[271,371],"fighting":[666,581],"poison":[769,274],"ground":[90,80],"flying":[416,414],"psychic":[731,640],"bug":[903,170],"rock":[448,336],"ghost":[910,335],"dragon":[111,582],"dark":[823,612],"steel":[230,519],"fairy":[687,416]};
const GROUP_B=new Set(['fighting','poison','psychic','bug','ghost','dark','fairy']);
function buildGroups(id){
  const el=document.getElementById(id), svg=d3.select(el);
  svg.attr('viewBox','0 0 1000 720'); addDefs(svg,id);
  const pos={}; TYPES.forEach(t=>pos[t.id]={x:GPOS[t.id][0],y:GPOS[t.id][1]});
  const box=(ids,label)=>{const xs=ids.map(i=>pos[i].x),ys=ids.map(i=>pos[i].y);
    const x0=Math.min(...xs)-62,x1=Math.max(...xs)+62,y0=Math.min(...ys)-62,y1=Math.max(...ys)+62;
    svg.append('rect').attr('class','grp-bg').attr('x',x0).attr('y',y0).attr('width',x1-x0).attr('height',y1-y0).attr('rx',28);
    svg.append('text').attr('class','grp-lab').attr('data-k',label).attr('x',x0+18).attr('y',y0+22).text(tr(label));
    return {x:(x0+x1)/2,y:(y0+y1)/2};};
  const cA=box(TYPES.filter(t=>!GROUP_B.has(t.id)).map(t=>t.id),'groupA');
  const cB=box([...GROUP_B],'groupB');
  const paths=svg.append('g').selectAll('path').data(EDGES).join('path')
    .attr('class',e=>'e '+(e.m===2?'s2':'s05'))
    .attr('marker-end',e=>`url(#${id}-${e.m===2?'a2':'a05'})`)
    .attr('d',e=>{const p=pos[e.s]; if(e.s===e.t){const c=GROUP_B.has(e.s)?cB:cA; return loopPath(p,unit(p.x-c.x,p.y-c.y),NR);} return arcPath(p,pos[e.t],NR,.08);});
  const gN=svg.append('g');
  const nodes=drawNodes(gN,TYPES).attr('transform',d=>`translate(${pos[d.id].x},${pos[d.id].y})`);
  nodes.append('text').attr('class','lab').attr('y',NR+16).attr('text-anchor','middle').text(d=>d.n);
  bindNode(nodes,el);
  views.push({apply:()=>applyCommon(svg,paths,nodes,true)});
}

function mult(a,d){ if(IMM[a]&&IMM[a].includes(d)) return 0; if(SE[a]&&SE[a].includes(d)) return 2; if(NVE[a]&&NVE[a].includes(d)) return .5; return 1; }

const P=Object.assign({sdef:true,satk:false,sfreq:'low',mnem:'def',def:'both',focus:'',pause:'d5err',fmt:'num',extra:false,smart:true,imm:true}, lsGet(LS_SET)||{});

function textOn(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;return (0.299*r+0.587*g+0.114*b)>0.62?'#17181c':'#fff';}
function pill(id){const t=BY[id];return `<span class="tpill" style="--c:${t.c};--tc:${textOn(t.c)}">${iconSVG(t,26)}${t.n}</span>`;}
function mini(id){const t=BY[id];return `<span class="tk">${iconSVG(t,15)}${t.n}</span>`;}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function randQ(){
  const dual = P.def==='dual' || (P.def==='both' && Math.random()<.5);
  const defsWith=must=>{ if(!dual) return [must||rnd(IDS)]; const a=must||rnd(IDS); let b; do{b=rnd(IDS);}while(b===a); return [a,b]; };
  let att, defs;
  if(P.focus && Math.random()<.5){ att=P.focus; defs=defsWith(); }
  else if(P.focus){ att=rnd(IDS); defs=defsWith(P.focus); }
  else { att=rnd(IDS); defs=defsWith(); }
  defs.sort((x,y)=>BY[x].i-BY[y].i);
  return {att,defs,ans:effOf(att,defs),key:att+'>'+defs.join('+')};
}
function pickQ(){
  const ok=x=>(P.imm||x.ans!==0) && (!Q||x.key!==Q.key);
  const c=[]; let guard=0;
  while(c.length<(P.smart?8:1) && guard++<400){ const x=randQ(); if(ok(x)) c.push(x); }
  if(!c.length) return randQ();
  if(!P.smart) return c[0];
  const w=x=>{const s=ST.m[x.key]; const n=s?s[1]:0, err=s?s[1]-s[0]:0; return .4+4*(err+.5)/(n+1);};
  const ws=c.map(w), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<c.length;i++){ r-=ws[i]; if(r<=0) return c[i]; }
  return c[c.length-1];
}

/* ===== Preguntas de tipo completo: colocar los 18 tipos en su columna ===== */
const ZONES=[{m:2,s:'x2'},{m:1,s:'x1'},{m:.5,s:'x0.5'},{m:0,s:'x0'}];
let place={}, sel=null;
function sortChance(){
  if(!P.sdef && !P.satk) return 0;
  const base={low:.1,mid:.2,high:.33}[P.sfreq]||.1;
  if(!P.smart) return base;
  let ok=0,n=0; for(const v of Object.values(ST.s||{})){ ok+=v[2]; n+=v[3]; }
  const err=(n-ok+1)/(n+6);                    // sin datos ≈ 1/6
  return Math.min(.5, base*(.6+3*err));         // fallas mucho → salen más; lo dominas → salen menos
}
function pickSort(){
  const modes=[]; if(P.sdef) modes.push('def'); if(P.satk) modes.push('atk');
  const c=[]; modes.forEach(mode=>(P.focus?[P.focus]:IDS).forEach(t=>c.push({mode,t,key:mode+':'+t})));
  const pool=c.length>1&&Q?c.filter(x=>x.key!==Q.key):c;
  const w=x=>{ if(!P.smart) return 1; const s=(ST.s||{})[x.key]; const err=s?(s[3]-s[2]+1)/(s[3]+4):.35; return .3+4*err; };
  const ws=pool.map(w), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot, pick=pool[pool.length-1];
  for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0){ pick=pool[i]; break; } }
  const truth={}; IDS.forEach(id=>truth[id]= pick.mode==='def' ? mult(id,pick.t) : mult(pick.t,id));
  return {kind:'sort',...pick,truth};
}
function chipHTML(id){
  const t=BY[id]; let cls='sc', tag='';
  if(answered){ const ok=place[id]===Q.truth[id]; cls+=ok?' good':' bad'; if(!ok) tag=`<span class="fix">→ ${NUM[Q.truth[id]]}</span>`; }
  else if(sel===id) cls+=' sel';
  return `<button class="${cls}" data-id="${id}" ${answered?'':'draggable="true"'} aria-label="${t.n}">${iconSVG(t,18)}<span>${t.n}</span>${tag}</button>`;
}
function renderBoard(){
  const zone=(z,i)=>`<div class="zone${sel&&!answered?' armed':''}${z.m===0?' imm':''}" data-m="${z.m}"><div class="zh"><b>${tr('zones')[i]}</b><span>${z.s}</span><span class="k">${i+1}</span></div>
    <div class="zc">${IDS.filter(id=>place[id]===z.m).map(chipHTML).join('')}</div></div>`;
  document.getElementById('qsort').innerHTML=`<div class="cols">${ZONES.slice(0,3).map(zone).join('')}</div>${zone(ZONES[3],3)}`;
}
function moveTo(id,m){ if(answered||!id) return; place[id]=m; sel=null; renderBoard(); }
function checkSort(){
  if(answered||!Q||Q.kind!=='sort') return; answered=true; sel=null;
  let ok=0; const wrongM=new Set();
  IDS.forEach(id=>{
    const truth=Q.truth[id], got=place[id], right=truth===got;
    if(right) ok++; else wrongM.add(truth);
    if(truth!==1||got!==1){ const k=Q.mode==='def'? id+'>'+Q.t : Q.t+'>'+id; const s=ST.m[k]||[0,0]; ST.m[k]=[s[0]+(right?1:0),s[1]+1]; }
  });
  const perfect=ok===IDS.length;
  ST.s=ST.s||{}; const s=ST.s[Q.key]||[0,0,0,0]; ST.s[Q.key]=[s[0]+(perfect?1:0),s[1]+1,s[2]+ok,s[3]+IDS.length];
  ST.total++; if(perfect) ST.ok++;
  streak=perfect?streak+1:0; ST.best=Math.max(ST.best||0,streak);
  document.getElementById('qstreak').textContent=streak;
  renderBoard();
  const t=Q.t, lines=[];
  const add=l=>{ if(l&&!lines.includes(l)) lines.push(l); };
  [...wrongM].sort((a,b)=>b-a).forEach(m=>{
    if(m===2) add(mnHTML(MN[t][Q.mode==='def'?'d2':'a2']));
    else if(m===.5) add(mnHTML(MN[t][Q.mode==='def'?'d05':'a05']));
    else if(m===0) IDS.forEach(id=>{ const k=Q.mode==='def'? id+'>'+t : t+'>'+id; if(IMMN[k]) add(mnHTML(IMMN[k])); });
    else add(Q.mode==='def' ? tr('restDef')(mini(t)) : tr('restAtk')(mini(t)));
  });
  const fb=document.getElementById('qfb');
  fb.innerHTML=`<div class="fbh ${perfect?'ok':'ko'}">${perfect?tr('perfect'):tr('okOf')(ok)}</div>${perfect?'':`<p class="neu">${tr('redHint')}</p>`}${lines.map(l=>`<div class="mn2">${l}</div>`).join('')}`;
  fb.hidden=false;
  document.getElementById('qcheck').hidden=true;
  document.getElementById('qnext').hidden=false;
  queueSave(); renderSummary();
}
function initSort(){
  const box=document.getElementById('qsort');
  box.addEventListener('click',ev=>{
    if(answered) return;
    const chip=ev.target.closest('.sc'), zone=ev.target.closest('.zone');
    if(chip){ const id=chip.dataset.id;
      if(sel && sel!==id && place[sel]!==place[id]) moveTo(sel,place[id]);
      else { sel = sel===id ? null : id; renderBoard(); }
      return; }
    if(zone && sel) moveTo(sel,+zone.dataset.m);
  });
  box.addEventListener('dragstart',ev=>{ const c=ev.target.closest('.sc'); if(!c||answered) return; sel=c.dataset.id; try{ev.dataTransfer.setData('text/plain',sel);}catch(e){} ev.dataTransfer.effectAllowed='move'; });
  box.addEventListener('dragover',ev=>{ const z=ev.target.closest('.zone'); if(!z||answered) return; ev.preventDefault(); box.querySelectorAll('.zone.over').forEach(x=>x!==z&&x.classList.remove('over')); z.classList.add('over'); });
  box.addEventListener('dragleave',ev=>{ const z=ev.target.closest('.zone'); if(z&&!z.contains(ev.relatedTarget)) z.classList.remove('over'); });
  box.addEventListener('drop',ev=>{ const z=ev.target.closest('.zone'); if(!z) return; ev.preventDefault(); let id=sel; try{ id=ev.dataTransfer.getData('text/plain')||sel; }catch(e){} moveTo(id,+z.dataset.m); });
  box.addEventListener('dragend',()=>box.querySelectorAll('.zone.over').forEach(x=>x.classList.remove('over')));
  document.getElementById('qcheck').addEventListener('click',checkSort);
}
function sortSummary(){
  const rows=Object.entries(ST.s||{}).map(([k,[pf,n,ok,it]])=>({k,mode:k.split(':')[0],t:k.split(':')[1],pf,n,acc:Math.round(100*ok/it)})).sort((a,b)=>a.acc-b.acc);
  if(!rows.length) return '';
  return `<h3 class="mt">${tr('fullTypes')}</h3><ul class="fails">${rows.slice(0,8).map(r=>`<li><span class="mu">${r.mode==='def'?tr('sortRowDef'):tr('sortRowAtk')} ${mini(r.t)}</span><b style="color:${tone(r.acc)}">${r.acc}%</b><em class="cnt">${tr('times')(r.n)} · ${tr('perfects')(r.pf)}</em></li>`).join('')}</ul>`;
}

/* reglas para recordar un enfrentamiento (las mismas que la ficha de cada tipo) */
function memo(att,defs){
  // P.mnem: 'def' = reglas del que defiende (qué le entra / qué aguanta), 'atk' = del que ataca, 'both' = las dos
  const parts=defs.map(d=>({d,m:mult(att,d)}));
  const out=[]; const add=l=>{ if(l && !out.includes(l)) out.push(l); };
  for(const p of parts){
    if(p.m===1) continue;
    if(p.m===0){ add(mnHTML(IMMN[att+'>'+p.d])); continue; }
    if(P.mnem!=='atk') add(mnHTML(MN[p.d][p.m===2?'d2':'d05']));
    if(P.mnem!=='def') add(mnHTML(MN[att][p.m===2?'a2':'a05']));
  }
  const neutral=parts.filter(p=>p.m===1).map(p=>p.d);
  if(neutral.length) add(P.mnem==='atk'
    ? tr('neutralAtk')(mini(att),neutral.map(mini))
    : tr('neutralDef')(neutral.map(mini),mini(att)));
  return out;
}

/* resumen */
function agg(){
  const A={},D={}; IDS.forEach(i=>{A[i]=[0,0];D[i]=[0,0];});
  for(const [k,[ok,n]] of Object.entries(ST.m)){ const [a,ds]=k.split('>'); if(!A[a]) continue; A[a][0]+=ok;A[a][1]+=n;
    ds.split('+').forEach(d=>{ if(D[d]){D[d][0]+=ok;D[d][1]+=n;} }); }
  return {A,D};
}
const pct=s=>s[1]?Math.round(100*s[0]/s[1]):null;
const tone=p=>p===null?'':p>=80?'var(--sup)':p>=55?'var(--warn)':'var(--res)';
function bar(s){ const p=pct(s); if(p===null) return `<div class="b2 none"><span>—</span></div>`;
  return `<div class="b2" title="${tr('ofN')(s[0],s[1])}"><i style="width:${Math.max(p,3)}%;background:${tone(p)};border-color:${tone(p)}"></i><span>${p}%<small> · ${s[1]}</small></span></div>`; }
function renderSummary(){
  const el=document.getElementById('summ'), kept=document.getElementById('xfIn')?.value;
  renderSummaryInner(el);
  const inp=document.getElementById('xfIn'); if(inp&&kept) inp.value=kept;
  if(xfer==='export') exportCode().then(c=>{ xferCode=c; const a=document.getElementById('xfCode'); if(a) a.value=c; });
}
function renderSummaryInner(el){
  if(!ST.total){ el.innerHTML=`<h2 class="sh">${tr('yourSummary')}</h2><p class="muted">${tr('summaryEmpty')}</p>${xferHTML()}<p class="store">${tr(storeNote)}</p>`; return; }
  const {A,D}=agg();
  const score=id=>{const ok=A[id][0]+D[id][0], n=A[id][1]+D[id][1]; return {n, s:(ok+1)/(n+2), p:n?Math.round(100*ok/n):null};};
  const ranked=IDS.map(id=>({id,...score(id)})).filter(x=>x.n>=4).sort((a,b)=>b.s-a.s);
  const best=ranked.slice(0,3), worst=ranked.length>=6?ranked.slice(-3).reverse():[];
  const fails=Object.entries(ST.m).map(([k,[ok,n]])=>({k,err:n-ok,n})).filter(x=>x.err>0).sort((a,b)=>b.err-a.err||a.n-b.n).slice(0,6);
  const order=sortWorst ? IDS.slice().sort((a,b)=>{const sa=score(a),sb=score(b); return (sa.n?sa.s:2)-(sb.n?sb.s:2);}) : IDS;
  const chipT=x=>`<button class="chip" data-focus="${x.id}" title="${tr('practiceX')(BY[x.id].n)}">${iconSVG(BY[x.id],20)}${BY[x.id].n} <b style="color:${tone(x.p)}">${x.p}%</b></button>`;
  el.innerHTML=`<h2 class="sh">${tr('yourSummary')}</h2>
    <div class="stats3"><div><b>${ST.total}</b><span>${tr('answeredN')}</span></div><div><b>${Math.round(100*ST.ok/ST.total)}%</b><span>${tr('accuracy')}</span></div><div><b>${ST.best||0}</b><span>${tr('bestStreak')}</span></div></div>
    ${ranked.length>=3?`<div class="bw"><div><h3>${tr('bestAt')}</h3><div class="chips">${best.map(chipT).join('')}</div></div>
    ${worst.length?`<div><h3>${tr('review')}</h3><div class="chips">${worst.map(chipT).join('')}</div><p class="tip">${tr('tapToPractice')}</p></div>`:''}</div>`
    :`<p class="muted">${tr('needMore')}</p>`}
    <div class="thead"><h3>${tr('accByType')}</h3><button class="link" id="sortBtn">${sortWorst?tr('gameOrder'):tr('worstFirst')}</button></div>
    <div class="trow th"><span></span><span>${tr('whenAtk')}</span><span>${tr('whenDef')}</span></div>
    ${order.map(id=>`<div class="trow"><span class="tn">${iconSVG(BY[id],18)}${BY[id].n}</span>${bar(A[id])}${bar(D[id])}</div>`).join('')}
    ${fails.length?`<h3 class="mt">${tr('topFails')}</h3><ul class="fails">${fails.map(f=>{const [a,ds]=f.k.split('>');const d=ds.split('+');return `<li><span class="mu">${mini(a)} → ${d.map(mini).join(' / ')}</span><b>${NUM[effOf(a,d)]}</b><em class="cnt">${tr('failedN')(f.err,f.n)}</em>${memo(a,d).map(l=>`<div class="rec"><b>${tr('remember')}</b> ${l}</div>`).join('')}</li>`;}).join('')}</ul>`:''}
    ${sortSummary()}
    <div class="reset">${confirmReset?`<span>${tr('resetQ')}</span><button class="danger" id="rsYes">${tr('resetYes')}</button><button class="link" id="rsNo">${tr('cancel')}</button>`:`<button class="link" id="rsAsk">${tr('resetAsk')}</button>`}</div>
    ${xferHTML()}
    <p class="store">${tr(storeNote)}</p>`;
}
document.getElementById('summ').addEventListener('click',async ev=>{
  const t=ev.target.closest('button'); if(!t) return;
  if(t.id==='xfExp'){ xfer='export'; xferMsg=null; xferCopied=false; xferCode=await exportCode(); renderSummary(); return; }
  if(t.id==='xfImp'){ xfer='import'; xferMsg=null; renderSummary(); document.getElementById('xfIn').focus(); return; }
  if(t.id==='xfClose'){ xfer=null; xferMsg=null; renderSummary(); return; }
  if(t.id==='xfCopy'){
    try{ await navigator.clipboard.writeText(xferCode); }
    catch(e){ const a=document.getElementById('xfCode'); a.select(); try{ document.execCommand('copy'); }catch(_){} }
    xferCopied=true; renderSummary(); return; }
  if(t.id==='xfDo'){
    try{ ST=await importCode(document.getElementById('xfIn').value); streak=0; document.getElementById('qstreak').textContent=0; queueSave(); xfer=null; xferMsg={ok:true,n:ST.total}; }
    catch(e){ xferMsg={ok:false}; }
    renderSummary(); return; }
  if(t.dataset.focus){ P.focus=t.dataset.focus; document.getElementById('pfocus').value=P.focus; lsSet(LS_SET,P); newQuestion(); document.querySelector('.quiz').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.id==='sortBtn'){ sortWorst=!sortWorst; renderSummary(); }
  if(t.id==='rsAsk'){ confirmReset=true; renderSummary(); }
  if(t.id==='rsNo'){ confirmReset=false; renderSummary(); }
  if(t.id==='rsYes'){ confirmReset=false; ST={total:0,ok:0,best:0,m:{},s:{}}; streak=0; document.getElementById('qstreak').textContent=0; queueSave(); renderSummary(); }
});

/* guardado: base de datos de la página (privada por persona) y copia en el navegador */
let dbDoc=null, saving=false, dirty=false, saveT=null;
const toRows=s=>({v:1,total:s.total,ok:s.ok,best:s.best||0,rows:Object.entries(s.m).map(([k,[o,n]])=>[k,o,n]),srows:Object.entries(s.s||{}).map(([k,v])=>[k,...v])});
const fromRows=d=>({total:d.total||0,ok:d.ok||0,best:d.best||0,m:Object.fromEntries((d.rows||[]).map(([k,o,n])=>[k,[o,n]])),s:Object.fromEntries((d.srows||[]).map(([k,...v])=>[k,v]))});
/* exportar / importar: TCT1.<base64url(deflate-raw(JSON))>; TCT0. sin comprimir si el navegador no tiene CompressionStream */
let xfer=null, xferCode='', xferMsg=null, xferCopied=false;
const b64e=u8=>{ let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const b64d=str=>{ str=str.replace(/-/g,'+').replace(/_/g,'/'); const s=atob(str+'==='.slice((str.length+3)%4)); return Uint8Array.from(s,c=>c.charCodeAt(0)); };
const pipeU8=async(u8,ts)=>new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer());
async function exportCode(){
  const raw=new TextEncoder().encode(JSON.stringify(toRows(ST)));
  if(typeof CompressionStream==='function'){ try{ return 'TCT1.'+b64e(await pipeU8(raw,new CompressionStream('deflate-raw'))); }catch(e){} }
  return 'TCT0.'+b64e(raw);
}
async function importCode(code){
  const m=/^TCT([01])\.([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g,''));
  if(!m) throw new Error('format');
  let u8=b64d(m[2]);
  if(m[1]==='1') u8=await pipeU8(u8,new DecompressionStream('deflate-raw'));
  return cleanRows(JSON.parse(new TextDecoder().decode(u8)));
}
/* solo deja pasar claves de tipos reales y contadores enteros coherentes */
function cleanRows(d){
  const nat=x=>Number.isInteger(x)&&x>=0&&x<1e7, isT=t=>IDS.includes(t);
  if(!d||d.v!==1||!Array.isArray(d.rows)) throw new Error('shape');
  const keyOk=k=>{ const m=/^([a-z]+)>([a-z]+)(?:\+([a-z]+))?$/.exec(k); return !!m && isT(m[1]) && isT(m[2]) && (!m[3]||isT(m[3])); };
  const rows=d.rows.filter(r=>Array.isArray(r)&&r.length===3&&typeof r[0]==='string'&&keyOk(r[0])&&nat(r[1])&&nat(r[2])&&r[1]<=r[2]);
  const srows=(Array.isArray(d.srows)?d.srows:[]).filter(r=>Array.isArray(r)&&r.length===5&&typeof r[0]==='string'&&/^(def|atk):[a-z]+$/.test(r[0])&&isT(r[0].split(':')[1])&&r.slice(1).every(nat));
  const total=nat(d.total)?d.total:0;
  return fromRows({total, ok:nat(d.ok)?Math.min(d.ok,total):0, best:nat(d.best)?d.best:0, rows, srows});
}
function xferHTML(){
  let h=`<div class="xfer"><h3>${tr('xferTitle')}</h3><div class="xbtns"><button class="link" id="xfExp">${tr('exportBtn')}</button><button class="link" id="xfImp">${tr('importBtn')}</button></div>`;
  if(xfer==='export') h+=`<textarea id="xfCode" rows="3" readonly onfocus="this.select()">${xferCode}</textarea><p class="hintf">${tr('exportHelp')}</p>
    <div class="xbtns"><button class="primary" id="xfCopy">${tr(xferCopied?'copied':'copy')}</button><button class="link" id="xfClose">${tr('close')}</button></div>`;
  if(xfer==='import') h+=`<textarea id="xfIn" rows="3" spellcheck="false" autocomplete="off" placeholder="TCT1.…"></textarea><p class="hintf">${tr('importHelp')}</p>
    <div class="xbtns"><button class="primary" id="xfDo">${tr('importDo')}</button><button class="link" id="xfClose">${tr('close')}</button></div>`;
  if(xferMsg) h+=`<p class="xmsg ${xferMsg.ok?'ok':'ko'}" role="status">${xferMsg.ok?tr('importOk')(xferMsg.n):tr('importBad')}</p>`;
  return h+'</div>';
}
function queueSave(){ lsSet(LS_ST,toRows(ST)); if(!dbDoc) return; dirty=true; clearTimeout(saveT); saveT=setTimeout(flush,1500); }
async function flush(){
  if(!dbDoc||saving||!dirty) return; saving=true; dirty=false;
  try{ await dbDoc.set(toRows(ST)); }
  catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){ dbDoc=null; storeNote='storeLocalOnly'; renderSummary(); } else dirty=true; }
  saving=false; if(dirty&&dbDoc) saveT=setTimeout(flush,3000);
}
async function initStore(){
  const l=lsGet(LS_ST); if(l&&l.rows) ST=fromRows(l);
  renderSummary();
  try{
    const c=window.claude; if(!c||!c.use) return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/practica');
    const snap=await ref.get(); dbDoc=ref;
    if(snap.exists){ const d=fromRows(snap.data()); if(d.total>=ST.total){ ST=d; lsSet(LS_ST,toRows(ST)); } else queueSave(); }
    else if(ST.total) queueSave();
    storeNote='storeAccount';
    renderSummary();
  }catch(e){ dbDoc=null; }
}

/* ajustes */
function initPractice(){
  focusOptions();
  document.querySelectorAll('input[name=pdef]').forEach(r=>r.checked=r.value===P.def);
  document.querySelectorAll('input[name=ppause]').forEach(r=>r.checked=r.value===P.pause);
  document.querySelectorAll('input[name=pfmt]').forEach(r=>r.checked=r.value===P.fmt);
  document.querySelectorAll('input[name=pmnem]').forEach(r=>r.checked=r.value===P.mnem);
  document.getElementById('pextra').checked=P.extra; document.getElementById('psmart').checked=P.smart; document.getElementById('pimm').checked=P.imm;
  document.getElementById('psdef').checked=P.sdef; document.getElementById('psatk').checked=P.satk; document.getElementById('psfreq').value=P.sfreq;
  document.getElementById('prset').addEventListener('change',ev=>{
    const t=ev.target;
    if(t.name==='pmnem'){ P.mnem=t.value; lsSet(LS_SET,P); renderSummary(); return; }
    if(t.name==='pdef') P.def=t.value; else if(t.name==='ppause') P.pause=t.value; else if(t.name==='pfmt') P.fmt=t.value;
    else if(t.id==='pfocus') P.focus=t.value; else if(t.id==='pextra') P.extra=t.checked; else if(t.id==='psmart') P.smart=t.checked; else if(t.id==='pimm') P.imm=t.checked;
    else if(t.id==='psdef') P.sdef=t.checked; else if(t.id==='psatk') P.satk=t.checked; else if(t.id==='psfreq') P.sfreq=t.value;
    lsSet(LS_SET,P);
    if(!answered) newQuestion();
  });
  if(window.innerWidth<860) document.getElementById('prset').open=false;
  document.getElementById('qopts').addEventListener('click',ev=>{const b=ev.target.closest('.opt'); if(b) answer(+b.dataset.m);});
  document.getElementById('qnext').addEventListener('click',()=>newQuestion());
  initSort();
  document.addEventListener('keydown',ev=>{
    if(S.view!=='practica'||ev.altKey||ev.ctrlKey||ev.metaKey) return;
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;
    if(Q && Q.kind==='sort' && !answered){
      if(/^[1-4]$/.test(ev.key) && sel){ ev.preventDefault(); moveTo(sel,ZONES[+ev.key-1].m); }
      else if(ev.key==='Enter'){ ev.preventDefault(); checkSort(); }
      return;
    }
    if(!answered && /^[1-6]$/.test(ev.key)){ const b=document.querySelectorAll('#qopts .opt')[+ev.key-1]; if(b){ev.preventDefault(); answer(+b.dataset.m);} }
    else if(answered && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); newQuestion(); }
  });
  initStore();
}
